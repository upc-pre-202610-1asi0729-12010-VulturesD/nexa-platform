spring:
  application:
    name: nexa-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      docker:
        - postgres
        - seed
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

nexa:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
